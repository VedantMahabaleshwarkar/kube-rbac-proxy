version: "2"
linters:
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # FIXME: golang.org/x/net v0.58.0 deprecated http2/h2c in favour of setting
      # http.Server.Protocols. Migrating the serving path is out of scope for a
      # dependency bump; tracked separately.
      - linters:
          - staticcheck
        text: "SA1019:.*h2c"
    paths:
      - test/
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
